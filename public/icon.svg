<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded App Container Background -->
  <rect width="512" height="512" rx="105" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Subtle Cyan Ambient Underglow -->
  <circle cx="360" cy="150" r="140" fill="#22d3ee" opacity="0.12" filter="blur(40px)"/>

  <!-- Centered Scaled Nivarp Geometric "N" -->
  <g transform="translate(100, 115) scale(8.8)">
    <!-- Pure White Bold Geometric "N" -->
    <path
      d="M6 29V8.5C6 7.67 6.67 7 7.5 7H10C10.55 7 11.07 7.3 11.34 7.78L22 23.5V8.5C22 7.67 22.67 7 23.5 7H25C25.83 7 26.5 7.67 26.5 8.5V27.5C26.5 28.33 25.83 29 25 29H22.5C21.95 29 21.43 28.7 21.16 28.22L10.5 12.5V27.5C10.5 28.33 9.83 29 9 29H7.5C6.67 29 6 28.33 6 27.5V29Z"
      fill="#FFFFFF"
    />

    <!-- Trending Breakout Arrow with Neon Glow (Pointing ↗) -->
    <g filter="url(#neonGlow)">
      <line
        x1="22"
        y1="12"
        x2="31"
        y2="3"
        stroke="#22D3EE"
        stroke-width="2.8"
        stroke-linecap="round"
      />
      <path
        d="M24.5 3H31V9.5"
        stroke="#22D3EE"
        stroke-width="2.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>
</svg>